<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hitster de mon amie 🎵</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <h1>🎵 Hitster</h1>

    <p class="subtitle">
      Le jeu musical
    </p>

    <button id="loginButton">
      Se connecter à Spotify
    </button>

    <div id="app" class="hidden">

      <div class="status">
        <span id="statusDot">●</span>
        <span id="statusText">Connexion à Spotify...</span>
      </div>

      <div class="player">

        <div class="album-placeholder">
          🎵
        </div>

        <h2 id="songTitle">
          Aucune chanson
        </h2>

        <p id="artistName">
          Scanne une carte pour commencer
        </p>

        <button id="playButton">
          ▶️ Lecture / Pause
        </button>

      </div>

      <div class="scanner">

        <h2>📱 Scanner une carte</h2>

        <p>
          La fonction de scan sera ajoutée à l'étape suivante.
        </p>

        <button id="testButton">
          🎶 Tester avec une chanson
        </button>

      </div>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
